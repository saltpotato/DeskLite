ble%22%7D%5D%7D">
  <title>DeskLite - Web Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #1e1e24;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #111;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #333;
      z-index: 10;
    }
    header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #3b82f6;
      white-space: nowrap;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    input {
      background: #2b2b36;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 13px;
    }
    input:focus { outline: none; border-color: #3b82f6; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
    }
    button:hover { background: #1d4ed8; }
    #status {
      font-size: 12px;
      color: #aaa;
      margin-left: auto;
    }
    #viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #000;
      overflow: hidden;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      cursor: default;
      display: block;
    }
    .badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      margin-right: 6px;
    }
    .badge.green { background: #10b981; }
    .badge.yellow { background: #f59e0b; }

    /* Immersive fullscreen mode (macOS & browser safe: stays 14px below y=0 top edge!) */
    #fsPullTab {
      display: none;
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      background: rgba(18, 18, 24, 0.78);
      backdrop-filter: blur(8px);
      color: #e2e8f0;
      border: 1px solid rgba(96, 165, 250, 0.45);
      border-radius: 999px;
      padding: 5px 16px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      opacity: 0.45;
      transition: opacity 0.2s ease, transform 0.2s ease, background 0.2s ease;
      user-select: none;
    }
    #fsPullTab:hover {
      opacity: 1;
      background: rgba(37, 99, 235, 0.92);
      transform: translateX(-50%) scale(1.04);
    }
    #btnPinToolbar {
      display: none;
      background: #374151;
      padding: 4px 8px;
      font-size: 11px;
    }
    #btnPinToolbar.pinned {
      background: #2563eb;
    }
    body.is-fullscreen #fsPullTab {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    body.is-fullscreen.toolbar-open #fsPullTab {
      display: none;
    }
    body.is-fullscreen #btnPinToolbar {
      display: inline-block;
    }
    body.is-fullscreen header {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(-140%);
      background: rgba(18, 18, 24, 0.94);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      border: 1px solid #4b5563;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.7);
      transition: transform 0.22s ease, opacity 0.22s ease;
      opacity: 0;
      pointer-events: none;
      max-width: 96vw;
    }
    body.is-fullscreen.toolbar-open header {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    body.is-fullscreen #viewport {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="fsPullTab" onmouseenter="openFsToolbar()" onclick="openFsToolbar()" title="Show DeskLite Controls">
    <span>⚡ DeskLite</span>
    <span style="font-size:10px; opacity:0.8;">▾</span>
  </div>
  <header id="mainHeader" onmouseenter="cancelFsToolbarHide()" onmouseleave="scheduleFsToolbarHide()">
    <h1>⚡ DeskLite</h1>
    <div class="controls">
      <input type="text" id="targetId" list="recentPartnersList" placeholder="Host ID (e.g. 123 456)" size="14" oninput="onTargetIdInput()">
      <datalist id="recentPartnersList"></datalist>
      <input type="password" id="targetPwd" placeholder="Password" size="10">
      <button id="btnConnect" onclick="toggleConnect()">Connect</button>
      <button id="btnFullscreen" type="button" onclick="toggleFullscreen()">⛶ Fullscreen</button>
      <button id="btnPinToolbar" type="button" onclick="togglePinToolbar()" title="Pin / Unpin toolbar in fullscreen">📌 Pin</button>
      <div id="qualityControls" style="display:none; align-items:center; gap:4px;">
        <div style="height: 20px; width: 1px; background: #444; margin: 0 2px;"></div>
        <button type="button" onclick="setQuality(65, 1.0)" style="background:#059669; padding:4px 8px; font-size:11px;" title="Very fast, native 1:1 sharpness">🚀 Fast</button>
        <button type="button" onclick="setQuality(75, 1.0)" style="background:#2563eb; padding:4px 8px; font-size:11px;" title="Balanced speed & crisp quality">⚖️ Balanced</button>
        <button type="button" onclick="setQuality(85, 1.0)" style="background:#7c3aed; padding:4px 8px; font-size:11px;" title="Maximum detail & colors">💎 HQ</button>
        <div style="height: 20px; width: 1px; background: #444; margin: 0 4px;"></div>
        <button type="button" onclick="sendShortcut('desktop')" style="background:#374151; padding:4px 8px; font-size:11px;" title="Show Desktop / Minimize all windows (Win+D)">🖥️ Desktop</button>
        <button type="button" onclick="sendClipboard()" style="background:#374151; padding:4px 8px; font-size:11px;" title="Send local clipboard text to remote PC">📋 Paste</button>
        <button type="button" onclick="sendShortcut('win_key')" style="background:#374151; padding:4px 8px; font-size:11px;" title="Open Start Menu">🪟 Start</button>
        <button type="button" onclick="sendShortcut('explorer')" style="background:#374151; padding:4px 8px; font-size:11px;" title="Open File Explorer">📁 Explorer</button>
        <button type="button" id="btnVisionDebug" onclick="toggleVisionDebug()" style="background:#0d9488; padding:4px 8px; font-size:11px;" title="Toggle Android-style Vision Surface Update Debug Coloring">🔬 Debug: ON</button>
      </div>
      <div style="height: 20px; width: 1px; background: #444; margin: 0 4px;"></div>
      <a href="/download/DeskLite.exe" download style="text-decoration:none;">
        <button type="button" style="background:#10b981;" title="Standalone Windows App (.exe) - no Python required">📥 App (.exe)</button>
      </a>
    </div>
    <div id="status">
      <span id="badge" class="badge"></span>
      <span id="statusText">Ready</span>
    </div>
  </header>

  <div id="viewport">
    <div id="welcomeOverlay" style="text-align:center; padding: 30px; max-width: 600px; background: #262630; border-radius: 12px; border: 1px solid #3d3d4e; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
      <h2 style="margin-bottom: 12px; color: #60a5fa; font-size: 24px;">⚡ DeskLite</h2>
      <p style="color: #cbd5e1; font-size: 14px; margin-bottom: 24px; line-height: 1.6;">
        Control remote PCs directly in this browser window or download the client for your PC:
      </p>
      <div style="display:flex; justify-content:center; gap: 14px; margin-bottom: 20px; flex-wrap: wrap;">
        <a href="/download/DeskLite.exe" download style="text-decoration:none;">
          <button type="button" style="background:#10b981; padding: 12px 26px; font-size: 15px; border-radius: 6px;">
            📥 <strong>Download DeskLite.exe</strong><br><small style="opacity:0.85; font-size: 11px;">Standalone Windows App (no Python required)</small>
          </button>
        </a>
      </div>
      <p style="color: #94a3b8; font-size: 12px;">
        💡 <em>Simply download, launch the file, and enter or share the displayed ID above.</em>
      </p>
      <div id="recentSection" style="display:none; margin-top:24px; text-align:left; background:#1e1e24; border-radius:8px; padding:12px 16px; border:1px solid #3d3d4e;">
        <div style="font-weight:600; font-size:12px; color:#94a3b8; margin-bottom:8px; text-transform:uppercase; letter-spacing:0.5px;">🕒 Recently Connected Partners</div>
        <div id="recentListContainer" style="display:flex; flex-direction:column; gap:6px;"></div>
      </div>
    </div>
    <canvas id="screenCanvas" style="display:none;"></canvas>
    <canvas id="debugCanvas" style="display:none; position:absolute; pointer-events:none;"></canvas>
  </div>

  <script>
    let ws = null;
    let isConnected = false;
    let shouldReconnect = false;
    let canvas = document.getElementById("screenCanvas");
    let ctx = canvas.getContext("2d");
    let debugCanvas = document.getElementById("debugCanvas");
    let debugCtx = debugCanvas.getContext("2d");
    let visionDebugMode = true;
    let debugRects = [];
    let debugStats = { cache: 0, scroll: 0, jpeg: 0 };
    let statusText = document.getElementById("statusText");
    let badge = document.getElementById("badge");
    let btnConnect = document.getElementById("btnConnect");
    let remoteWidth = 1920;
    let remoteHeight = 1080;
    let lastMouseSend = 0;

    // Partner history management
    const STORAGE_KEY = "desklite_partners";

    function getSavedPartners() {
      try {
        let partners = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!partners || !partners.length) {
          // Backward compatibility fallback
          partners = JSON.parse(localStorage.getItem("rustdesk_light_partners")) || [];
        }
        return partners;
      } catch (e) {
        return [];
      }
    }

    function savePartner(id, pwd) {
      if (!id) return;
      let list = getSavedPartners().filter(p => p.id !== id);
      list.unshift({ id: id, pwd: pwd, date: new Date().toLocaleDateString("en-US") });
      if (list.length > 8) list = list.slice(0, 8);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      updateRecentUI();
    }

    function removePartner(e, id) {
      if (e) e.stopPropagation();
      let list = getSavedPartners().filter(p => p.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      updateRecentUI();
    }

    function selectPartner(id, pwd) {
      document.getElementById("targetId").value = id;
      document.getElementById("targetPwd").value = pwd || "";
      toggleConnect();
    }

    function onTargetIdInput() {
      const val = document.getElementById("targetId").value.trim();
      const match = getSavedPartners().find(p => p.id === val);
      if (match && match.pwd) {
        document.getElementById("targetPwd").value = match.pwd;
      }
    }

    function updateRecentUI() {
      const partners = getSavedPartners();
      const datalist = document.getElementById("recentPartnersList");
      if (datalist) {
        datalist.innerHTML = partners.map(p => `<option value="${p.id}"></option>`).join("");
      }

      const container = document.getElementById("recentListContainer");
      const section = document.getElementById("recentSection");
      if (!container || !section) return;

      if (partners.length === 0) {
        section.style.display = "none";
        return;
      }

      section.style.display = "block";
      container.innerHTML = partners.map(p => `
        <div style="display:flex; align-items:center; justify-content:space-between; background:#2a2b36; padding:8px 12px; border-radius:6px; cursor:pointer;" onclick="selectPartner('${p.id}', '${p.pwd || ''}')">
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="font-size:16px;">💻</span>
            <span style="font-weight:600; font-family:monospace; font-size:14px; color:#60a5fa;">${p.id}</span>
            <span style="font-size:11px; color:#94a3b8;">(${p.date || 'Saved'})</span>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <button type="button" style="background:#2563eb; padding:4px 10px; font-size:11px; border-radius:4px;" onclick="event.stopPropagation(); selectPartner('${p.id}', '${p.pwd || ''}')">⚡ Connect</button>
            <button type="button" style="background:transparent; color:#9ca3af; border:none; padding:4px 6px; font-size:12px; cursor:pointer;" onclick="removePartner(event, '${p.id}')" title="Remove">✕</button>
          </div>
        </div>
      `).join("");
    }

    // Auto-restore last partner or from URL param (?id=123456)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("id")) {
      document.getElementById("targetId").value = urlParams.get("id");
    } else {
      const recent = getSavedPartners();
      if (recent.length > 0) {
        document.getElementById("targetId").value = recent[0].id;
        if (recent[0].pwd) {
          document.getElementById("targetPwd").value = recent[0].pwd;
        }
      }
    }
    updateRecentUI();

    function setStatus(text, type) {
      statusText.innerText = text;
      badge.className = "badge " + (type || "");
    }

    let fsToolbarPinned = false;
    let fsHideTimer = null;

    function openFsToolbar() {
      if (fsHideTimer) {
        clearTimeout(fsHideTimer);
        fsHideTimer = null;
      }
      document.body.classList.add("toolbar-open");
    }

    function cancelFsToolbarHide() {
      if (fsHideTimer) {
        clearTimeout(fsHideTimer);
        fsHideTimer = null;
      }
    }

    function scheduleFsToolbarHide() {
      if (fsToolbarPinned) return;
      if (fsHideTimer) clearTimeout(fsHideTimer);
      fsHideTimer = setTimeout(() => {
        if (!fsToolbarPinned) {
          document.body.classList.remove("toolbar-open");
        }
      }, 450);
    }

    function togglePinToolbar() {
      fsToolbarPinned = !fsToolbarPinned;
      const btn = document.getElementById("btnPinToolbar");
      if (btn) {
        btn.classList.toggle("pinned", fsToolbarPinned);
        btn.innerText = fsToolbarPinned ? "📌 Pinned" : "📌 Pin";
      }
      if (fsToolbarPinned) {
        openFsToolbar();
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      }
    }

    document.addEventListener("fullscreenchange", () => {
      const btn = document.getElementById("btnFullscreen");
      if (document.fullscreenElement) {
        document.body.classList.add("is-fullscreen");
        if (fsToolbarPinned) {
          document.body.classList.add("toolbar-open");
        } else {
          document.body.classList.remove("toolbar-open");
        }
        if (btn) btn.innerText = "✕ Exit Fullscreen";
      } else {
        document.body.classList.remove("is-fullscreen");
        document.body.classList.remove("toolbar-open");
        if (btn) btn.innerText = "⛶ Fullscreen";
      }
    });

    function toggleConnect() {
      if (isConnected || shouldReconnect) {
        shouldReconnect = false;
        disconnect();
      } else {
        shouldReconnect = true;
        connect();
      }
    }

    let p2pWs = null;
    let rtcPc = null;
    let rtcChannel = null;
    let p2pUpgrading = false;
    let dcChunks = {};

    function sendMsg(payloadStr) {
      if (p2pWs && p2pWs.readyState === WebSocket.OPEN) {
        p2pWs.send(payloadStr);
        return;
      }
      if (rtcChannel && rtcChannel.readyState === "open") {
        rtcChannel.send(payloadStr);
        return;
      }
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(payloadStr);
      }
    }

    function cleanupP2P() {
      p2pUpgrading = false;
      dcChunks = {};
      if (p2pWs) {
        try { p2pWs.close(); } catch (e) {}
        p2pWs = null;
      }
      if (rtcChannel) {
        try { rtcChannel.close(); } catch (e) {}
        rtcChannel = null;
      }
      if (rtcPc) {
        try { rtcPc.close(); } catch (e) {}
        rtcPc = null;
      }
    }

    function disconnect() {
      shouldReconnect = false;
      cleanupP2P();
      if (ws) {
        ws.close();
      }
      isConnected = false;
      btnConnect.innerText = "Connect";
      btnConnect.style.background = "#2563eb";
      setStatus("Disconnected", "");
      document.getElementById("welcomeOverlay").style.display = "block";
      document.getElementById("qualityControls").style.display = "none";
      canvas.style.display = "none";
      debugCanvas.style.display = "none";
    }

    function toggleVisionDebug() {
      visionDebugMode = !visionDebugMode;
      const btn = document.getElementById("btnVisionDebug");
      if (btn) {
        btn.innerText = visionDebugMode ? "🔬 Debug: ON" : "🔬 Debug: OFF";
        btn.style.background = visionDebugMode ? "#0d9488" : "#374151";
      }
      if (!visionDebugMode) {
        debugRects = [];
        debugCtx.clearRect(0, 0, debugCanvas.width, debugCanvas.height);
      } else {
        renderDebugOverlay();
      }
    }

    function recordDebugRect(x, y, w, h, kind, label) {
      if (!visionDebugMode || w <= 0 || h <= 0) return;
      const now = performance.now();
      debugRects = debugRects.filter(r => (now - r.ts) <= 950);
      debugRects.push({ x, y, w, h, kind, label, ts: now });
      if (debugRects.length > 36) debugRects.shift();
    }

    function renderDebugOverlay() {
      if (!visionDebugMode) return;
      if (debugCanvas.width !== canvas.width || debugCanvas.height !== canvas.height) {
        debugCanvas.width = canvas.width;
        debugCanvas.height = canvas.height;
      }
      debugCtx.clearRect(0, 0, debugCanvas.width, debugCanvas.height);
      const palette = {
        cache:  { fill: "rgba(16, 185, 129, 0.28)", stroke: "#10b981", tag: "rgba(6, 95, 70, 0.9)" },
        scroll: { fill: "rgba(14, 165, 233, 0.24)", stroke: "#38bdf8", tag: "rgba(12, 74, 110, 0.9)" },
        jpeg:   { fill: "rgba(244, 63, 94, 0.30)",  stroke: "#fb7185", tag: "rgba(136, 19, 55, 0.9)" },
        full:   { fill: "rgba(245, 158, 11, 0.16)", stroke: "#fbbf24", tag: "rgba(120, 53, 15, 0.9)" }
      };
      debugCtx.font = "600 13px -apple-system, BlinkMacSystemFont, sans-serif";
      for (const r of debugRects) {
        const p = palette[r.kind] || palette.jpeg;
        debugCtx.fillStyle = p.fill;
        debugCtx.fillRect(r.x, r.y, r.w, r.h);
        debugCtx.lineWidth = 2;
        debugCtx.strokeStyle = p.stroke;
        debugCtx.strokeRect(r.x, r.y, r.w, r.h);
        if (r.w >= 90 && r.h >= 24) {
          const tw = Math.min(r.w - 6, Math.max(110, r.label.length * 7.8 + 14));
          debugCtx.fillStyle = p.tag;
          debugCtx.fillRect(r.x + 3, r.y + 3, tw, 20);
          debugCtx.fillStyle = "#ffffff";
          debugCtx.fillText(r.label, r.x + 8, r.y + 17);
        }
      }
      // Top-left Legend Bar
      debugCtx.fillStyle = "rgba(15, 23, 42, 0.88)";
      debugCtx.fillRect(14, 14, 590, 30);
      debugCtx.strokeStyle = "rgba(56, 189, 248, 0.6)";
      debugCtx.strokeRect(14, 14, 590, 30);
      debugCtx.fillStyle = "#f1f5f9";
      debugCtx.fillText(
        `🔬 DEBUG  |  🟢 Cache (${debugStats.cache})   🔵 Scroll-Copy (${debugStats.scroll})   🔴 Net-JPEG (${debugStats.jpeg})`,
        26, 34
      );
    }

    function setQuality(quality, scale) {
      if (isConnected) {
        sendMsg(JSON.stringify({ type: "set_quality", quality: quality, scale: scale }));
        setStatus(`Profile: ${quality}%, ${Math.round(scale*100)}% Scale`, "green");
      }
    }

    function sendShortcut(name) {
      if (isConnected) {
        sendMsg(JSON.stringify({ type: "input", data: { event: "shortcut", name: name } }));
      }
    }

    async function sendClipboard() {
      if (!isConnected) return;
      try {
        let text = "";
        if (navigator.clipboard && navigator.clipboard.readText) {
          text = await navigator.clipboard.readText();
        }
        if (!text) {
          text = prompt("Enter text to paste on remote PC:");
        }
        if (text) {
          sendMsg(JSON.stringify({ type: "clipboard", text: text }));
          setStatus("📋 Clipboard sent to host", "green");
        }
      } catch(e) {
        let text = prompt("Enter text to paste on remote PC:");
        if (text && isConnected) {
          sendMsg(JSON.stringify({ type: "clipboard", text: text }));
          setStatus("📋 Clipboard sent to host", "green");
        }
      }
    }

    function connect() {
      const targetId = document.getElementById("targetId").value.trim();
      const pwd = document.getElementById("targetPwd").value.trim();
      if (!targetId) {
        alert("Please enter a Host ID!");
        shouldReconnect = false;
        return;
      }

      cleanupP2P();
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const host = location.host || "localhost:8765";
      const wsUrl = `${protocol}//${host}`;

      setStatus("Connecting to signaling server...", "yellow");
      btnConnect.innerText = "Disconnect";
      btnConnect.style.background = "#dc2626";

      ws = new WebSocket(wsUrl);
      ws.binaryType = "arraybuffer";

      let frameQueue = [];
      let isRendering = false;

      function enqueueBinaryFrame(buf) {
        if (!buf || buf.byteLength < 4) return;
        const u8 = new Uint8Array(buf);
        // Check for 'DC' (0x44, 0x43) WebRTC DataChannel chunk header
        if (u8[0] === 0x44 && u8[1] === 0x43 && buf.byteLength > 6) {
          const view = new DataView(buf, 0, 6);
          const seq = view.getUint16(2);
          const idx = view.getUint8(4);
          const total = view.getUint8(5);
          if (!dcChunks[seq] || dcChunks[seq].total !== total) {
            if (Object.keys(dcChunks).length > 4) dcChunks = {};
            dcChunks[seq] = { total: total, parts: {}, count: 0, byteLen: 0 };
          }
          const entry = dcChunks[seq];
          if (!entry.parts[idx]) {
            const slice = new Uint8Array(buf, 6);
            entry.parts[idx] = slice;
            entry.count += 1;
            entry.byteLen += slice.byteLength;
          }
          if (entry.count === total) {
            const full = new Uint8Array(entry.byteLen);
            let offset = 0;
            for (let i = 0; i < total; i++) {
              full.set(entry.parts[i], offset);
              offset += entry.parts[i].byteLength;
            }
            delete dcChunks[seq];
            enqueueCompleteFrame(full.buffer);
          }
          return;
        }
        enqueueCompleteFrame(buf);
      }

      const vfStateCache = new Map();
      const vfScratchCanvas = document.createElement("canvas");
      const vfScratchCtx = vfScratchCanvas.getContext("2d");

      function enqueueCompleteFrame(buf) {
        const u8 = new Uint8Array(buf, 0, 2);
        const isDelta = (u8[0] === 0x44 && u8[1] === 0x4C) || (u8[0] === 0x56 && u8[1] === 0x46);
        if (!isDelta) {
          frameQueue.length = 0;
        }
        frameQueue.push(buf);
        if (!isRendering) {
          isRendering = true;
          requestAnimationFrame(processFrameQueue);
        }
      }

      async function decodeVfPacket(buf) {
        if (buf.byteLength < 4) return;
        const view = new DataView(buf);
        const count = view.getUint8(2);
        let offset = 3;
        for (let i = 0; i < count && offset < buf.byteLength; i++) {
          const cmd = view.getUint8(offset);
          if (cmd === 0x01 && offset + 17 <= buf.byteLength) {
            // CMD_SAVE_STATE
            const sid = view.getBigUint64(offset + 1, false).toString();
            const sx = view.getUint16(offset + 9, false);
            const sy = view.getUint16(offset + 11, false);
            const sw = view.getUint16(offset + 13, false);
            const sh = view.getUint16(offset + 15, false);
            offset += 17;
            if (sw > 0 && sh > 0) {
              const c = document.createElement("canvas");
              c.width = sw;
              c.height = sh;
              c.getContext("2d").drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);
              vfStateCache.set(sid, c);
              if (vfStateCache.size > 48) {
                const firstKey = vfStateCache.keys().next().value;
                vfStateCache.delete(firstKey);
              }
            }
          } else if (cmd === 0x02 && offset + 17 <= buf.byteLength) {
            // CMD_RESTORE_STATE
            const sid = view.getBigUint64(offset + 1, false).toString();
            const dx = view.getUint16(offset + 9, false);
            const dy = view.getUint16(offset + 11, false);
            const dw = view.getUint16(offset + 13, false);
            const dh = view.getUint16(offset + 15, false);
            offset += 17;
            const cached = vfStateCache.get(sid);
            if (cached) {
              ctx.drawImage(cached, dx, dy, dw, dh);
              debugStats.cache++;
              recordDebugRect(dx, dy, dw, dh, "cache", "RAM CACHE (0 KB)");
            }
          } else if (cmd === 0x03 && offset + 17 <= buf.byteLength) {
            // CMD_TRANSFORM_RECT (2D scroll / pan / zoom)
            const sx = view.getUint16(offset + 1, false);
            const sy = view.getUint16(offset + 3, false);
            const sw = view.getUint16(offset + 5, false);
            const sh = view.getUint16(offset + 7, false);
            const dx = view.getUint16(offset + 9, false);
            const dy = view.getUint16(offset + 11, false);
            const dw = view.getUint16(offset + 13, false);
            const dh = view.getUint16(offset + 15, false);
            offset += 17;
            if (sw > 0 && sh > 0 && dw > 0 && dh > 0) {
              if (vfScratchCanvas.width < sw || vfScratchCanvas.height < sh) {
                vfScratchCanvas.width = Math.max(vfScratchCanvas.width, sw);
                vfScratchCanvas.height = Math.max(vfScratchCanvas.height, sh);
              }
              vfScratchCtx.drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);
              ctx.drawImage(vfScratchCanvas, 0, 0, sw, sh, dx, dy, dw, dh);
              debugStats.scroll++;
              const shiftY = sy - dy;
              recordDebugRect(dx, dy, dw, dh, "scroll", `GPU SCROLL (dy:${shiftY > 0 ? "+" : ""}${shiftY}px, 0 KB)`);
            }
          } else if (cmd === 0x04 && offset + 10 <= buf.byteLength) {
            // CMD_MARK_DIRTY
            const sid = view.getBigUint64(offset + 1, false).toString();
            offset += 10;
            vfStateCache.delete(sid);
          } else if (cmd === 0x05 && offset + 13 <= buf.byteLength) {
            // CMD_JPEG_PATCH
            const dx = view.getUint16(offset + 1, false);
            const dy = view.getUint16(offset + 3, false);
            const dw = view.getUint16(offset + 5, false);
            const dh = view.getUint16(offset + 7, false);
            const jlen = view.getUint32(offset + 9, false);
            offset += 13;
            if (offset + jlen <= buf.byteLength) {
              const blob = new Blob([new Uint8Array(buf, offset, jlen)], { type: "image/jpeg" });
              offset += jlen;
              try {
                const bmp = await createImageBitmap(blob);
                ctx.drawImage(bmp, dx, dy, dw, dh);
                bmp.close();
                debugStats.jpeg++;
                recordDebugRect(dx, dy, dw, dh, "jpeg", `NET JPEG (${(jlen / 1024).toFixed(1)} KB)`);
              } catch (e) {}
            } else {
              break;
            }
          } else if (cmd === 0x06 && offset + 5 <= buf.byteLength) {
            // CMD_OVERLAY_META
            const mlen = view.getUint32(offset + 1, false);
            offset += 5 + mlen;
          } else {
            break;
          }
        }
      }

      async function processFrameQueue() {
        while (frameQueue.length > 0) {
          const buf = frameQueue.shift();
          const u8 = new Uint8Array(buf, 0, 2);
          if (u8[0] === 0x56 && u8[1] === 0x46) {
            await decodeVfPacket(buf);
          } else if (u8[0] === 0x44 && u8[1] === 0x4C && buf.byteLength > 10) {
            const view = new DataView(buf, 0, 10);
            const dx = view.getUint16(2);
            const dy = view.getUint16(4);
            const dw = view.getUint16(6);
            const dh = view.getUint16(8);
            const jlen = buf.byteLength - 10;
            const blob = new Blob([new Uint8Array(buf, 10)], { type: "image/jpeg" });
            try {
              const bmp = await createImageBitmap(blob);
              ctx.drawImage(bmp, dx, dy, dw, dh);
              bmp.close();
              debugStats.jpeg++;
              recordDebugRect(dx, dy, dw, dh, "jpeg", `NET JPEG (${(jlen / 1024).toFixed(1)} KB)`);
            } catch (e) {}
          } else {
            const blob = new Blob([buf], { type: "image/jpeg" });
            try {
              const bmp = await createImageBitmap(blob);
              if (canvas.width !== bmp.width || canvas.height !== bmp.height) {
                canvas.width = bmp.width;
                canvas.height = bmp.height;
              }
              ctx.drawImage(bmp, 0, 0);
              debugStats.jpeg++;
              recordDebugRect(0, 0, bmp.width, bmp.height, "full", `FULL FRAME (${(buf.byteLength / 1024).toFixed(1)} KB)`);
              bmp.close();
            } catch (e) {}
          }
        }
        renderDebugOverlay();
        isRendering = false;
      }

      async function tryDirectP2PUpgrade(endpoints, token, webrtcSupported) {
        // 1. Try Direct WebSocket on LAN/VPN if page is HTTP
        if (location.protocol !== "https:" && Array.isArray(endpoints) && token) {
          for (const ep of endpoints) {
            if (p2pWs || (rtcChannel && rtcChannel.readyState === "open")) return;
            try {
              const candidate = await new Promise((resolve, reject) => {
                const s = new WebSocket(ep);
                s.binaryType = "arraybuffer";
                const timer = setTimeout(() => { try { s.close(); } catch(e) {} reject(); }, 750);
                s.onopen = () => {
                  s.send(JSON.stringify({ action: "p2p_auth", token: token }));
                };
                s.onmessage = (ev) => {
                  if (typeof ev.data === "string") {
                    try {
                      const r = JSON.parse(ev.data);
                      if (r.status === "p2p_connected") {
                        clearTimeout(timer);
                        resolve(s);
                      }
                    } catch (e) {}
                  }
                };
                s.onerror = () => { clearTimeout(timer); reject(); };
              });
              p2pWs = candidate;
              if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "p2p_takeover" }));
              }
              setStatus(`Direct P2P Connected (${targetId})`, "green");
              p2pWs.onmessage = (ev) => {
                if (typeof ev.data === "string") {
                  handleJsonMsg(ev.data, false);
                } else if (ev.data instanceof ArrayBuffer) {
                  enqueueBinaryFrame(ev.data);
                }
              };
              p2pWs.onclose = () => { p2pWs = null; };
              return;
            } catch (e) {}
          }
        }

        // 2. Try WebRTC STUN UDP Hole Punching across routers
        if (webrtcSupported && window.RTCPeerConnection && ws && ws.readyState === WebSocket.OPEN) {
          try {
            rtcPc = new RTCPeerConnection({
              iceServers: [
                { urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"] }
              ]
            });
            const dc = rtcPc.createDataChannel("desklite");
            dc.binaryType = "arraybuffer";
            dc.onopen = () => {
              rtcChannel = dc;
              if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "p2p_takeover" }));
              }
              setStatus(`Direct P2P WebRTC (${targetId})`, "green");
            };
            dc.onmessage = (ev) => {
              if (typeof ev.data === "string") {
                handleJsonMsg(ev.data, false);
              } else if (ev.data instanceof ArrayBuffer) {
                enqueueBinaryFrame(ev.data);
              }
            };
            dc.onclose = () => {
              if (rtcChannel === dc) rtcChannel = null;
            };

            const offer = await rtcPc.createOffer();
            await rtcPc.setLocalDescription(offer);
            // Wait up to 600ms for STUN ICE candidates to be gathered into localDescription
            await new Promise((resolve) => {
              if (rtcPc.iceGatheringState === "complete") return resolve();
              const t = setTimeout(resolve, 600);
              rtcPc.onicegatheringstatechange = () => {
                if (rtcPc && rtcPc.iceGatheringState === "complete") {
                  clearTimeout(t);
                  resolve();
                }
              };
            });
            if (ws && ws.readyState === WebSocket.OPEN && rtcPc.localDescription) {
              ws.send(JSON.stringify({
                type: "webrtc_offer",
                sdp: rtcPc.localDescription.sdp,
                sdpType: rtcPc.localDescription.type
              }));
            }
          } catch (e) {}
        }
      }

      function handleJsonMsg(rawStr, fromSignaling) {
        try {
          const msg = JSON.parse(rawStr);
          if (msg.status === "connected") {
            isConnected = true;
            savePartner(targetId, pwd);
            setStatus(`Connected to ${targetId}`, "green");
            document.getElementById("welcomeOverlay").style.display = "none";
            document.getElementById("qualityControls").style.display = "flex";
            canvas.style.display = "block";
            debugCanvas.style.display = "block";
          } else if (msg.status === "error") {
            if (msg.message && (msg.message.toLowerCase().includes("password") || msg.message.toLowerCase().includes("passwort"))) {
              shouldReconnect = false;
              alert(msg.message);
              disconnect();
            } else {
              setStatus(msg.message + " – retrying in 2s...", "yellow");
            }
          } else if (msg.type === "screen_info") {
            remoteWidth = msg.width;
            remoteHeight = msg.height;
            canvas.width = remoteWidth;
            canvas.height = remoteHeight;
            if (fromSignaling && !p2pUpgrading && !p2pWs && !rtcChannel) {
              p2pUpgrading = true;
              tryDirectP2PUpgrade(msg.p2p_endpoints || [], msg.p2p_token || "", !!msg.webrtc_supported);
            }
          } else if (msg.type === "webrtc_answer" && rtcPc) {
            rtcPc.setRemoteDescription(new RTCSessionDescription({
              type: msg.sdpType || "answer",
              sdp: msg.sdp
            })).catch(() => {});
          } else if (msg.type === "host_disconnected") {
            setStatus("Host disconnected – waiting for reconnect...", "yellow");
          } else if (msg.type === "clipboard") {
            if (msg.text) {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(msg.text).catch(() => {});
              }
              setStatus("📋 Clipboard synced from host", "green");
            }
          }
        } catch(e) {}
      }

      ws.onopen = () => {
        setStatus("Authenticating...", "yellow");
        ws.send(JSON.stringify({
          action: "connect",
          target_id: targetId,
          password: pwd
        }));
      };

      ws.onmessage = async (evt) => {
        if (typeof evt.data === "string") {
          handleJsonMsg(evt.data, true);
        } else if (evt.data instanceof ArrayBuffer) {
          enqueueBinaryFrame(evt.data);
        }
      };

      ws.onclose = () => {
        if (shouldReconnect) {
          setStatus("Connection lost – reconnecting in 2s...", "yellow");
          setTimeout(() => {
            if (shouldReconnect) {
              connect();
            }
          }, 2000);
        } else {
          isConnected = false;
          btnConnect.innerText = "Connect";
          btnConnect.style.background = "#2563eb";
          setStatus("Disconnected", "");
        }
      };

      ws.onerror = (e) => {
        setStatus("Connection error", "");
      };
    }

    function getNormalizedCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      return {
        x: Math.min(1.0, Math.max(0.0, x)),
        y: Math.min(1.0, Math.max(0.0, y))
      };
    }

    // Mouse handlers (80Hz smooth tracking)
    canvas.addEventListener("mousemove", (e) => {
      if (!isConnected) return;
      const now = performance.now();
      if (now - lastMouseSend < 12) return;
      lastMouseSend = now;
      const { x, y } = getNormalizedCoords(e);
      sendMsg(JSON.stringify({ type: "input", data: { event: "mouse_move", x, y } }));
    });

    canvas.addEventListener("mousedown", (e) => {
      if (!isConnected) return;
      const { x, y } = getNormalizedCoords(e);
      sendMsg(JSON.stringify({ type: "input", data: { event: "mouse_move", x, y } }));
      const btn = e.button === 2 ? "right" : (e.button === 1 ? "middle" : "left");
      sendMsg(JSON.stringify({ type: "input", data: { event: "mouse_down", button: btn } }));
    });

    canvas.addEventListener("mouseup", (e) => {
      if (!isConnected) return;
      const btn = e.button === 2 ? "right" : (e.button === 1 ? "middle" : "left");
      sendMsg(JSON.stringify({ type: "input", data: { event: "mouse_up", button: btn } }));
    });

    canvas.addEventListener("contextmenu", (e) => e.preventDefault());

    canvas.addEventListener("wheel", (e) => {
      if (!isConnected) return;
      e.preventDefault();
      const delta = e.deltaY < 0 ? 1 : -1;
      sendMsg(JSON.stringify({ type: "input", data: { event: "mouse_wheel", delta } }));
    }, { passive: false });

    // Keyboard handlers
    window.addEventListener("keydown", (e) => {
      if (!isConnected) return;
      if (e.target.tagName === "INPUT") return;
      sendMsg(JSON.stringify({
        type: "input",
        data: { event: "key_down", key: e.key, char: e.key.length === 1 ? e.key : "" }
      }));
      if (["Tab", "Alt", "F1", "F3", "F5"].includes(e.key)) e.preventDefault();
    });

    window.addEventListener("keyup", (e) => {
      if (!isConnected) return;
      if (e.target.tagName === "INPUT") return;
      sendMsg(JSON.stringify({
        type: "input",
        data: { event: "key_up", key: e.key, char: e.key.length === 1 ? e.key : "" }
      }));
    });

    window.addEventListener("paste", (e) => {
      if (!isConnected) return;
      if (e.target.tagName === "INPUT") return;
      const text = (e.clipboardData || window.clipboardData).getData("text");
      if (text) {
        sendMsg(JSON.stringify({ type: "clipboard", text: text }));
        setStatus("📋 Clipboard sent to host", "green");
      }
    });

    window.addEventListener("pagehide", () => disconnect());
    window.addEventListener("beforeunload", () => disconnect());
  </script>
</body>
