<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RustDesk Light - Web Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #1e1e24;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #111;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #333;
      z-index: 10;
    }
    header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #3b82f6;
      white-space: nowrap;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    input {
      background: #2b2b36;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 13px;
    }
    input:focus { outline: none; border-color: #3b82f6; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
    }
    button:hover { background: #1d4ed8; }
    #status {
      font-size: 12px;
      color: #aaa;
      margin-left: auto;
    }
    #viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #000;
      overflow: hidden;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      cursor: default;
      display: block;
    }
    .badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      margin-right: 6px;
    }
    .badge.green { background: #10b981; }
    .badge.yellow { background: #f59e0b; }
  </style>
</head>
<body>
  <header>
    <h1>⚡ RustDesk Light</h1>
    <div class="controls">
      <input type="text" id="targetId" placeholder="Host-ID (z. B. 123 456)" size="14">
      <input type="password" id="targetPwd" placeholder="Passwort" size="10">
      <button id="btnConnect" onclick="toggleConnect()">Verbinden</button>
      <button onclick="document.body.requestFullscreen()">⛶ Vollbild</button>
      <div id="qualityControls" style="display:none; align-items:center; gap:4px;">
        <div style="height: 20px; width: 1px; background: #444; margin: 0 2px;"></div>
        <button type="button" onclick="setQuality(45, 0.60)" style="background:#059669; padding:4px 8px; font-size:11px;" title="Sehr schnell, minimales Datenvolumen">🚀 Turbo</button>
        <button type="button" onclick="setQuality(60, 0.75)" style="background:#2563eb; padding:4px 8px; font-size:11px;" title="Gutes Gleichgewicht">⚖️ Normal</button>
        <button type="button" onclick="setQuality(75, 1.0)" style="background:#7c3aed; padding:4px 8px; font-size:11px;" title="Volle 1:1 Auflösung">💎 HQ</button>
        <div style="height: 20px; width: 1px; background: #444; margin: 0 4px;"></div>
        <button type="button" onclick="sendShortcut('win_key')" style="background:#374151; padding:4px 8px; font-size:11px;" title="Startmenü öffnen">🪟 Start</button>
        <button type="button" onclick="sendShortcut('explorer')" style="background:#374151; padding:4px 8px; font-size:11px;" title="Windows Explorer öffnen">📁 Explorer</button>
        <button type="button" onclick="sendShortcut('task_manager')" style="background:#374151; padding:4px 8px; font-size:11px;" title="Task-Manager öffnen">⚙️ Taskmgr</button>
      </div>
      <div style="height: 20px; width: 1px; background: #444; margin: 0 4px;"></div>
      <a href="/download/RustDeskLight.exe" download style="text-decoration:none;">
        <button type="button" style="background:#10b981;" title="Eigenständige EXE - kein Python nötig">📥 App (.exe)</button>
      </a>
      <a href="/download/RustDeskLight-Client.zip" download style="text-decoration:none;">
        <button type="button" style="background:#6366f1;" title="ZIP-Archiv mit App, Skripten und Config">📦 Paket (.zip)</button>
      </a>
    </div>
    <div id="status">
      <span id="badge" class="badge"></span>
      <span id="statusText">Bereit</span>
    </div>
  </header>

  <div id="viewport">
    <div id="welcomeOverlay" style="text-align:center; padding: 30px; max-width: 600px; background: #262630; border-radius: 12px; border: 1px solid #3d3d4e; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
      <h2 style="margin-bottom: 12px; color: #60a5fa; font-size: 24px;">⚡ RustDesk Light</h2>
      <p style="color: #cbd5e1; font-size: 14px; margin-bottom: 24px; line-height: 1.6;">
        Steuere entfernte PCs direkt in diesem Browserfenster oder lade den Client für deinen PC herunter:
      </p>
      <div style="display:flex; justify-content:center; gap: 14px; margin-bottom: 20px; flex-wrap: wrap;">
        <a href="/download/RustDeskLight.exe" download style="text-decoration:none;">
          <button type="button" style="background:#10b981; padding: 12px 20px; font-size: 15px; border-radius: 6px;">
            📥 <strong>RustDeskLight.exe</strong><br><small style="opacity:0.85; font-size: 11px;">Standalone Windows App (kein Python nötig)</small>
          </button>
        </a>
        <a href="/download/RustDeskLight-Client.zip" download style="text-decoration:none;">
          <button type="button" style="background:#6366f1; padding: 12px 20px; font-size: 15px; border-radius: 6px;">
            📦 <strong>Komplettes ZIP-Paket</strong><br><small style="opacity:0.85; font-size: 11px;">EXE + Python Skripte + Start-Batch</small>
          </button>
        </a>
      </div>
      <p style="color: #94a3b8; font-size: 12px;">
        💡 <em>Einfach die Datei herunterladen, starten und die angezeigte ID oben eingeben oder teilen.</em>
      </p>
    </div>
    <canvas id="screenCanvas" style="display:none;"></canvas>
  </div>

  <script>
    let ws = null;
    let isConnected = false;
    let canvas = document.getElementById("screenCanvas");
    let ctx = canvas.getContext("2d");
    let statusText = document.getElementById("statusText");
    let badge = document.getElementById("badge");
    let btnConnect = document.getElementById("btnConnect");
    let remoteWidth = 1920;
    let remoteHeight = 1080;
    let lastMouseSend = 0;

    // Auto-fill from URL param if present (?id=123456)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("id")) {
      document.getElementById("targetId").value = urlParams.get("id");
    }

    function setStatus(text, type) {
      statusText.innerText = text;
      badge.className = "badge " + (type || "");
    }

    function toggleConnect() {
      if (isConnected) {
        disconnect();
      } else {
        connect();
      }
    }

    function disconnect() {
      if (ws) {
        ws.close();
      }
      isConnected = false;
      btnConnect.innerText = "Verbinden";
      btnConnect.style.background = "#2563eb";
      setStatus("Getrennt", "");
      document.getElementById("welcomeOverlay").style.display = "block";
      document.getElementById("qualityControls").style.display = "none";
      canvas.style.display = "none";
    }

    function setQuality(quality, scale) {
      if (ws && isConnected) {
        ws.send(JSON.stringify({ type: "set_quality", quality: quality, scale: scale }));
        setStatus(`Profil: ${quality}%, ${Math.round(scale*100)}% Skalierung`, "green");
      }
    }

    function sendShortcut(name) {
      if (ws && isConnected) {
        ws.send(JSON.stringify({ type: "input", data: { event: "shortcut", name: name } }));
      }
    }

    function connect() {
      const targetId = document.getElementById("targetId").value.trim();
      const pwd = document.getElementById("targetPwd").value.trim();
      if (!targetId) {
        alert("Bitte eine Host-ID eingeben!");
        return;
      }

      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const host = location.host || "localhost:8765";
      const wsUrl = `${protocol}//${host}`;

      setStatus("Verbinde mit Server...", "yellow");
      ws = new WebSocket(wsUrl);
      ws.binaryType = "blob";

      ws.onopen = () => {
        setStatus("Authentifiziere...", "yellow");
        ws.send(JSON.stringify({
          action: "connect",
          target_id: targetId,
          password: pwd
        }));
      };

      ws.onmessage = async (evt) => {
        if (typeof evt.data === "string") {
          try {
            const msg = JSON.parse(evt.data);
            if (msg.status === "connected") {
              isConnected = true;
              btnConnect.innerText = "Trennen";
              btnConnect.style.background = "#dc2626";
              setStatus(`Verbunden mit ${targetId}`, "green");
              document.getElementById("welcomeOverlay").style.display = "none";
              document.getElementById("qualityControls").style.display = "flex";
              canvas.style.display = "block";
            } else if (msg.status === "error") {
              alert(msg.message);
              disconnect();
            } else if (msg.type === "screen_info") {
              remoteWidth = msg.width;
              remoteHeight = msg.height;
              canvas.width = remoteWidth;
              canvas.height = remoteHeight;
            } else if (msg.type === "host_disconnected") {
              alert("Host hat die Verbindung beendet.");
              disconnect();
            }
          } catch(e) {}
        } else if (evt.data instanceof Blob) {
          // Drop stale frames: always render only the freshest blob
          latestBlob = evt.data;
          if (!renderScheduled) {
            renderScheduled = true;
            requestAnimationFrame(renderFrame);
          }
        }
      };

      let latestBlob = null;
      let renderScheduled = false;

      function renderFrame() {
        renderScheduled = false;
        if (!latestBlob) return;
        const blob = latestBlob;
        latestBlob = null;
        createImageBitmap(blob).then(imgBitmap => {
          if (canvas.width !== imgBitmap.width || canvas.height !== imgBitmap.height) {
            canvas.width = imgBitmap.width;
            canvas.height = imgBitmap.height;
          }
          ctx.drawImage(imgBitmap, 0, 0);
        }).catch(() => {});
      }

      ws.onclose = () => {
        if (isConnected) {
          setStatus("Verbindung verloren", "");
          btnConnect.innerText = "Verbinden";
          btnConnect.style.background = "#2563eb";
          isConnected = false;
        }
      };

      ws.onerror = (e) => {
        setStatus("Verbindungsfehler", "");
      };
    }

    function getNormalizedCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      return {
        x: Math.min(1.0, Math.max(0.0, x)),
        y: Math.min(1.0, Math.max(0.0, y))
      };
    }

    // Mouse handlers (80Hz smooth tracking)
    canvas.addEventListener("mousemove", (e) => {
      if (!isConnected || !ws) return;
      const now = performance.now();
      if (now - lastMouseSend < 12) return;
      lastMouseSend = now;
      const { x, y } = getNormalizedCoords(e);
      ws.send(JSON.stringify({ type: "input", data: { event: "mouse_move", x, y } }));
    });

    canvas.addEventListener("mousedown", (e) => {
      if (!isConnected || !ws) return;
      const { x, y } = getNormalizedCoords(e);
      ws.send(JSON.stringify({ type: "input", data: { event: "mouse_move", x, y } }));
      const btn = e.button === 2 ? "right" : (e.button === 1 ? "middle" : "left");
      ws.send(JSON.stringify({ type: "input", data: { event: "mouse_down", button: btn } }));
    });

    canvas.addEventListener("mouseup", (e) => {
      if (!isConnected || !ws) return;
      const btn = e.button === 2 ? "right" : (e.button === 1 ? "middle" : "left");
      ws.send(JSON.stringify({ type: "input", data: { event: "mouse_up", button: btn } }));
    });

    canvas.addEventListener("contextmenu", (e) => e.preventDefault());

    canvas.addEventListener("wheel", (e) => {
      if (!isConnected || !ws) return;
      e.preventDefault();
      const delta = e.deltaY < 0 ? 1 : -1;
      ws.send(JSON.stringify({ type: "input", data: { event: "mouse_wheel", delta } }));
    }, { passive: false });

    // Keyboard handlers
    window.addEventListener("keydown", (e) => {
      if (!isConnected || !ws) return;
      if (e.target.tagName === "INPUT") return;
      ws.send(JSON.stringify({
        type: "input",
        data: { event: "key_down", key: e.key, char: e.key.length === 1 ? e.key : "" }
      }));
      if (["Tab", "Alt", "F1", "F3", "F5"].includes(e.key)) e.preventDefault();
    });

    window.addEventListener("keyup", (e) => {
      if (!isConnected || !ws) return;
      if (e.target.tagName === "INPUT") return;
      ws.send(JSON.stringify({
        type: "input",
        data: { event: "key_up", key: e.key, char: e.key.length === 1 ? e.key : "" }
      }));
    });
  </script>
</body>
</html>
