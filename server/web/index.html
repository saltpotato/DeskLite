<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeskLite - Web Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #1e1e24;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #111;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #333;
      z-index: 10;
    }
    header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #3b82f6;
      white-space: nowrap;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    input {
      background: #2b2b36;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 13px;
    }
    input:focus { outline: none; border-color: #3b82f6; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
    }
    button:hover { background: #1d4ed8; }
    #status {
      font-size: 12px;
      color: #aaa;
      margin-left: auto;
    }
    #viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #000;
      overflow: hidden;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      cursor: default;
      display: block;
    }
    .badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      margin-right: 6px;
    }
    .badge.green { background: #10b981; }
    .badge.yellow { background: #f59e0b; }
  </style>
</head>
<body>
  <header>
    <h1>⚡ DeskLite</h1>
    <div class="controls">
      <input type="text" id="targetId" list="recentPartnersList" placeholder="Host-ID (z. B. 123 456)" size="14" oninput="onTargetIdInput()">
      <datalist id="recentPartnersList"></datalist>
      <input type="password" id="targetPwd" placeholder="Passwort" size="10">
      <button id="btnConnect" onclick="toggleConnect()">Verbinden</button>
      <button onclick="document.body.requestFullscreen()">⛶ Vollbild</button>
      <div id="qualityControls" style="display:none; align-items:center; gap:4px;">
        <div style="height: 20px; width: 1px; background: #444; margin: 0 2px;"></div>
        <button type="button" onclick="setQuality(65, 1.0)" style="background:#059669; padding:4px 8px; font-size:11px;" title="Sehr schnell, native 1:1 Schärfe">🚀 Schnell</button>
        <button type="button" onclick="setQuality(75, 1.0)" style="background:#2563eb; padding:4px 8px; font-size:11px;" title="Gutes Gleichgewicht, gestochen scharf">⚖️ Normal</button>
        <button type="button" onclick="setQuality(85, 1.0)" style="background:#7c3aed; padding:4px 8px; font-size:11px;" title="Maximale Details & Farben">💎 HQ</button>
        <div style="height: 20px; width: 1px; background: #444; margin: 0 4px;"></div>
        <button type="button" onclick="sendShortcut('desktop')" style="background:#374151; padding:4px 8px; font-size:11px;" title="Desktop anzeigen / Alle Fenster minimieren (Win+D)">🖥️ Desktop</button>
        <button type="button" onclick="sendClipboard()" style="background:#374151; padding:4px 8px; font-size:11px;" title="Lokale Zwischenablage an entfernten PC senden">📋 Einfügen</button>
        <button type="button" onclick="sendShortcut('win_key')" style="background:#374151; padding:4px 8px; font-size:11px;" title="Startmenü öffnen">🪟 Start</button>
        <button type="button" onclick="sendShortcut('explorer')" style="background:#374151; padding:4px 8px; font-size:11px;" title="Windows Explorer öffnen">📁 Explorer</button>
      </div>
      <div style="height: 20px; width: 1px; background: #444; margin: 0 4px;"></div>
      <a href="/download/DeskLite.exe" download style="text-decoration:none;">
        <button type="button" style="background:#10b981;" title="Eigenständige Windows App (.exe) - kein Python nötig">📥 App (.exe)</button>
      </a>
    </div>
    <div id="status">
      <span id="badge" class="badge"></span>
      <span id="statusText">Bereit</span>
    </div>
  </header>

  <div id="viewport">
    <div id="welcomeOverlay" style="text-align:center; padding: 30px; max-width: 600px; background: #262630; border-radius: 12px; border: 1px solid #3d3d4e; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
      <h2 style="margin-bottom: 12px; color: #60a5fa; font-size: 24px;">⚡ DeskLite</h2>
      <p style="color: #cbd5e1; font-size: 14px; margin-bottom: 24px; line-height: 1.6;">
        Steuere entfernte PCs direkt in diesem Browserfenster oder lade den Client für deinen PC herunter:
      </p>
      <div style="display:flex; justify-content:center; gap: 14px; margin-bottom: 20px; flex-wrap: wrap;">
        <a href="/download/DeskLite.exe" download style="text-decoration:none;">
          <button type="button" style="background:#10b981; padding: 12px 26px; font-size: 15px; border-radius: 6px;">
            📥 <strong>DeskLite.exe herunterladen</strong><br><small style="opacity:0.85; font-size: 11px;">Eigenständige App für Windows (kein Python nötig)</small>
          </button>
        </a>
      </div>
      <p style="color: #94a3b8; font-size: 12px;">
        💡 <em>Einfach die Datei herunterladen, starten und die angezeigte ID oben eingeben oder teilen.</em>
      </p>
      <div id="recentSection" style="display:none; margin-top:24px; text-align:left; background:#1e1e24; border-radius:8px; padding:12px 16px; border:1px solid #3d3d4e;">
        <div style="font-weight:600; font-size:12px; color:#94a3b8; margin-bottom:8px; text-transform:uppercase; letter-spacing:0.5px;">🕒 Zuletzt verbundene Partner</div>
        <div id="recentListContainer" style="display:flex; flex-direction:column; gap:6px;"></div>
      </div>
    </div>
    <canvas id="screenCanvas" style="display:none;"></canvas>
  </div>

  <script>
    let ws = null;
    let isConnected = false;
    let shouldReconnect = false;
    let canvas = document.getElementById("screenCanvas");
    let ctx = canvas.getContext("2d");
    let statusText = document.getElementById("statusText");
    let badge = document.getElementById("badge");
    let btnConnect = document.getElementById("btnConnect");
    let remoteWidth = 1920;
    let remoteHeight = 1080;
    let lastMouseSend = 0;

    // Partner history management
    const STORAGE_KEY = "desklite_partners";

    function getSavedPartners() {
      try {
        let partners = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!partners || !partners.length) {
          // Backward compatibility fallback
          partners = JSON.parse(localStorage.getItem("rustdesk_light_partners")) || [];
        }
        return partners;
      } catch (e) {
        return [];
      }
    }

    function savePartner(id, pwd) {
      if (!id) return;
      let list = getSavedPartners().filter(p => p.id !== id);
      list.unshift({ id: id, pwd: pwd, date: new Date().toLocaleDateString("de-DE") });
      if (list.length > 8) list = list.slice(0, 8);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      updateRecentUI();
    }

    function removePartner(e, id) {
      if (e) e.stopPropagation();
      let list = getSavedPartners().filter(p => p.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      updateRecentUI();
    }

    function selectPartner(id, pwd) {
      document.getElementById("targetId").value = id;
      document.getElementById("targetPwd").value = pwd || "";
      toggleConnect();
    }

    function onTargetIdInput() {
      const val = document.getElementById("targetId").value.trim();
      const match = getSavedPartners().find(p => p.id === val);
      if (match && match.pwd) {
        document.getElementById("targetPwd").value = match.pwd;
      }
    }

    function updateRecentUI() {
      const partners = getSavedPartners();
      const datalist = document.getElementById("recentPartnersList");
      if (datalist) {
        datalist.innerHTML = partners.map(p => `<option value="${p.id}"></option>`).join("");
      }

      const container = document.getElementById("recentListContainer");
      const section = document.getElementById("recentSection");
      if (!container || !section) return;

      if (partners.length === 0) {
        section.style.display = "none";
        return;
      }

      section.style.display = "block";
      container.innerHTML = partners.map(p => `
        <div style="display:flex; align-items:center; justify-content:space-between; background:#2a2b36; padding:8px 12px; border-radius:6px; cursor:pointer;" onclick="selectPartner('${p.id}', '${p.pwd || ''}')">
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="font-size:16px;">💻</span>
            <span style="font-weight:600; font-family:monospace; font-size:14px; color:#60a5fa;">${p.id}</span>
            <span style="font-size:11px; color:#94a3b8;">(${p.date || 'Gespeichert'})</span>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <button type="button" style="background:#2563eb; padding:4px 10px; font-size:11px; border-radius:4px;" onclick="event.stopPropagation(); selectPartner('${p.id}', '${p.pwd || ''}')">⚡ Verbinden</button>
            <button type="button" style="background:transparent; color:#9ca3af; border:none; padding:4px 6px; font-size:12px; cursor:pointer;" onclick="removePartner(event, '${p.id}')" title="Löschen">✕</button>
          </div>
        </div>
      `).join("");
    }

    // Auto-restore last partner or from URL param (?id=123456)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("id")) {
      document.getElementById("targetId").value = urlParams.get("id");
    } else {
      const recent = getSavedPartners();
      if (recent.length > 0) {
        document.getElementById("targetId").value = recent[0].id;
        if (recent[0].pwd) {
          document.getElementById("targetPwd").value = recent[0].pwd;
        }
      }
    }
    updateRecentUI();

    function setStatus(text, type) {
      statusText.innerText = text;
      badge.className = "badge " + (type || "");
    }

    function toggleConnect() {
      if (isConnected || shouldReconnect) {
        shouldReconnect = false;
        disconnect();
      } else {
        shouldReconnect = true;
        connect();
      }
    }

    function disconnect() {
      shouldReconnect = false;
      if (ws) {
        ws.close();
      }
      isConnected = false;
      btnConnect.innerText = "Verbinden";
      btnConnect.style.background = "#2563eb";
      setStatus("Getrennt", "");
      document.getElementById("welcomeOverlay").style.display = "block";
      document.getElementById("qualityControls").style.display = "none";
      canvas.style.display = "none";
    }

    function setQuality(quality, scale) {
      if (ws && isConnected) {
        ws.send(JSON.stringify({ type: "set_quality", quality: quality, scale: scale }));
        setStatus(`Profil: ${quality}%, ${Math.round(scale*100)}% Skalierung`, "green");
      }
    }

    function sendShortcut(name) {
      if (ws && isConnected) {
        ws.send(JSON.stringify({ type: "input", data: { event: "shortcut", name: name } }));
      }
    }

    async function sendClipboard() {
      if (!ws || !isConnected) return;
      try {
        let text = "";
        if (navigator.clipboard && navigator.clipboard.readText) {
          text = await navigator.clipboard.readText();
        }
        if (!text) {
          text = prompt("Text zum Einfügen auf dem entfernten PC:");
        }
        if (text) {
          ws.send(JSON.stringify({ type: "clipboard", text: text }));
          setStatus("📋 Zwischenablage an Host gesendet", "green");
        }
      } catch(e) {
        let text = prompt("Text zum Einfügen auf dem entfernten PC:");
        if (text && ws && isConnected) {
          ws.send(JSON.stringify({ type: "clipboard", text: text }));
          setStatus("📋 Zwischenablage an Host gesendet", "green");
        }
      }
    }

    function connect() {
      const targetId = document.getElementById("targetId").value.trim();
      const pwd = document.getElementById("targetPwd").value.trim();
      if (!targetId) {
        alert("Bitte eine Host-ID eingeben!");
        shouldReconnect = false;
        return;
      }

      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const host = location.host || "localhost:8765";
      const wsUrl = `${protocol}//${host}`;

      setStatus("Verbinde mit Server...", "yellow");
      btnConnect.innerText = "Trennen";
      btnConnect.style.background = "#dc2626";

      ws = new WebSocket(wsUrl);
      ws.binaryType = "blob";

      ws.onopen = () => {
        setStatus("Authentifiziere...", "yellow");
        ws.send(JSON.stringify({
          action: "connect",
          target_id: targetId,
          password: pwd
        }));
      };

      ws.onmessage = async (evt) => {
        if (typeof evt.data === "string") {
          try {
            const msg = JSON.parse(evt.data);
            if (msg.status === "connected") {
              isConnected = true;
              savePartner(targetId, pwd);
              setStatus(`Verbunden mit ${targetId}`, "green");
              document.getElementById("welcomeOverlay").style.display = "none";
              document.getElementById("qualityControls").style.display = "flex";
              canvas.style.display = "block";
            } else if (msg.status === "error") {
              if (msg.message && msg.message.toLowerCase().includes("passwort")) {
                shouldReconnect = false;
                alert(msg.message);
                disconnect();
              } else {
                // Host temporarily unavailable or busy
                setStatus(msg.message + " – versuche erneut in 2s...", "yellow");
              }
            } else if (msg.type === "screen_info") {
              remoteWidth = msg.width;
              remoteHeight = msg.height;
              canvas.width = remoteWidth;
              canvas.height = remoteHeight;
            } else if (msg.type === "host_disconnected") {
              setStatus("Host getrennt – warte auf Wiederverbindung...", "yellow");
            } else if (msg.type === "clipboard") {
              if (msg.text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                  navigator.clipboard.writeText(msg.text).catch(() => {});
                }
                setStatus("📋 Zwischenablage vom Host übernommen", "green");
              }
            }
          } catch(e) {}
        } else if (evt.data instanceof Blob) {
          // Drop stale frames: always render only the freshest blob
          latestBlob = evt.data;
          if (!renderScheduled) {
            renderScheduled = true;
            requestAnimationFrame(renderFrame);
          }
        }
      };

      let latestBlob = null;
      let renderScheduled = false;

      function renderFrame() {
        renderScheduled = false;
        if (!latestBlob) return;
        const blob = latestBlob;
        latestBlob = null;
        createImageBitmap(blob).then(imgBitmap => {
          if (canvas.width !== imgBitmap.width || canvas.height !== imgBitmap.height) {
            canvas.width = imgBitmap.width;
            canvas.height = imgBitmap.height;
          }
          ctx.drawImage(imgBitmap, 0, 0);
        }).catch(() => {});
      }

      ws.onclose = () => {
        if (shouldReconnect) {
          setStatus("Verbindung unterbrochen – verbinde automatisch in 2s neu...", "yellow");
          setTimeout(() => {
            if (shouldReconnect) {
              connect();
            }
          }, 2000);
        } else {
          isConnected = false;
          btnConnect.innerText = "Verbinden";
          btnConnect.style.background = "#2563eb";
          setStatus("Getrennt", "");
        }
      };

      ws.onerror = (e) => {
        setStatus("Verbindungsfehler", "");
      };
    }

    function getNormalizedCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      return {
        x: Math.min(1.0, Math.max(0.0, x)),
        y: Math.min(1.0, Math.max(0.0, y))
      };
    }

    // Mouse handlers (80Hz smooth tracking)
    canvas.addEventListener("mousemove", (e) => {
      if (!isConnected || !ws) return;
      const now = performance.now();
      if (now - lastMouseSend < 12) return;
      lastMouseSend = now;
      const { x, y } = getNormalizedCoords(e);
      ws.send(JSON.stringify({ type: "input", data: { event: "mouse_move", x, y } }));
    });

    canvas.addEventListener("mousedown", (e) => {
      if (!isConnected || !ws) return;
      const { x, y } = getNormalizedCoords(e);
      ws.send(JSON.stringify({ type: "input", data: { event: "mouse_move", x, y } }));
      const btn = e.button === 2 ? "right" : (e.button === 1 ? "middle" : "left");
      ws.send(JSON.stringify({ type: "input", data: { event: "mouse_down", button: btn } }));
    });

    canvas.addEventListener("mouseup", (e) => {
      if (!isConnected || !ws) return;
      const btn = e.button === 2 ? "right" : (e.button === 1 ? "middle" : "left");
      ws.send(JSON.stringify({ type: "input", data: { event: "mouse_up", button: btn } }));
    });

    canvas.addEventListener("contextmenu", (e) => e.preventDefault());

    canvas.addEventListener("wheel", (e) => {
      if (!isConnected || !ws) return;
      e.preventDefault();
      const delta = e.deltaY < 0 ? 1 : -1;
      ws.send(JSON.stringify({ type: "input", data: { event: "mouse_wheel", delta } }));
    }, { passive: false });

    // Keyboard handlers
    window.addEventListener("keydown", (e) => {
      if (!isConnected || !ws) return;
      if (e.target.tagName === "INPUT") return;
      ws.send(JSON.stringify({
        type: "input",
        data: { event: "key_down", key: e.key, char: e.key.length === 1 ? e.key : "" }
      }));
      if (["Tab", "Alt", "F1", "F3", "F5"].includes(e.key)) e.preventDefault();
    });

    window.addEventListener("keyup", (e) => {
      if (!isConnected || !ws) return;
      if (e.target.tagName === "INPUT") return;
      ws.send(JSON.stringify({
        type: "input",
        data: { event: "key_up", key: e.key, char: e.key.length === 1 ? e.key : "" }
      }));
    });

    window.addEventListener("paste", (e) => {
      if (!isConnected || !ws) return;
      if (e.target.tagName === "INPUT") return;
      const text = (e.clipboardData || window.clipboardData).getData("text");
      if (text) {
        ws.send(JSON.stringify({ type: "clipboard", text: text }));
        setStatus("📋 Zwischenablage an Host gesendet", "green");
      }
    });
  </script>
</body>
</html>
